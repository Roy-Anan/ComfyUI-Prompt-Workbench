[package]
name = "comfyui-prompt-workbench"
version = "0.1.0"
description = "Local ComfyUI Prompt Workbench"
authors = ["Project Team"]
edition = "2021"

[lib]
name = "comfyui_prompt_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
